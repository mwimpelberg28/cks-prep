# Workloads for the Cilium network policy lab.
# Every pod that needs to act as a client carries a "curl" container.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    team: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: untrusted
  labels:
    team: untrusted
---
apiVersion: v1
kind: Namespace
metadata:
  name: qa
  labels:
    team: qa
---
# ---------------- shop/frontend ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, tier: web}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
      - name: curl
        image: curlimages/curl:8.11.1
        command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
# ---------------- shop/backend ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend, tier: api}
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=backend-ok"]
        ports: [{containerPort: 8080}]
      - name: curl
        image: curlimages/curl:8.11.1
        command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shop
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
# ---------------- shop/db ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db, tier: data}
    spec:
      containers:
      - name: db
        image: hashicorp/http-echo:1.0
        args: ["-listen=:6379", "-text=db-ok"]
        ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: shop
spec:
  selector: {app: db}
  ports: [{port: 6379, targetPort: 6379}]
---
# ---------------- untrusted/attacker ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attacker
  namespace: untrusted
spec:
  replicas: 1
  selector:
    matchLabels: {app: attacker}
  template:
    metadata:
      labels: {app: attacker}
    spec:
      containers:
      - name: curl
        image: curlimages/curl:8.11.1
        command: ["sh", "-c", "while true; do sleep 3600; done"]
---
# ---------------- qa/tester ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tester
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels: {app: tester}
  template:
    metadata:
      labels: {app: tester}
    spec:
      containers:
      - name: curl
        image: curlimages/curl:8.11.1
        command: ["sh", "-c", "while true; do sleep 3600; done"]
